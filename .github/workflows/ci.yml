name: Build and test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build free-preview image
        run: docker build -t teamforge-preview .
      - name: Check combined service in a 512 MiB container
        run: |
          docker run -d --name teamforge-preview --memory=512m -p 8080:8080 teamforge-preview
          trap 'docker logs teamforge-preview; docker rm -f teamforge-preview' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8080/ | grep 'id="root"'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/account/export)" = 401
          curl --fail --silent -H 'Content-Type: application/json' -d '{"description":"I can provide Java skills"}' http://127.0.0.1:8080/api/onboarding/skills
          docker stats --no-stream teamforge-preview
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teamforge_tests
          POSTGRES_USER: teamforge_tests
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamforge_tests -d teamforge_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: >-
          mvn -B -f backend/pom.xml verify
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/teamforge_tests
          -Dspring.datasource.username=teamforge_tests
          -Dspring.datasource.password=ephemeral-ci-only
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
      - name: Verify isolated backup restore
        run: |
          container='${{ job.services.postgres.id }}'
          docker exec "$container" pg_dump -U teamforge_tests -d teamforge_tests -Fc -f /tmp/teamforge-tests.dump
          docker exec "$container" createdb -U teamforge_tests teamforge_restore_tests
          docker exec "$container" pg_restore -U teamforge_tests -d teamforge_restore_tests --exit-on-error /tmp/teamforge-tests.dump
          migrations=$(docker exec "$container" psql -U teamforge_tests -d teamforge_restore_tests -Atc 'SELECT count(*) FROM flyway_schema_history WHERE success')
          test "$migrations" -eq 8
          docker exec "$container" psql -U teamforge_tests -d teamforge_restore_tests -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM accounts; SELECT count(*) FROM project_tasks; SELECT count(*) FROM collaboration_messages;'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-results
          path: backend/target/surefire-reports/
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: mvn -B -f backend/pom.xml -Prelease verify
      - uses: actions/upload-artifact@v4
        with:
          name: teamforge-release
          path: backend/target/teamforge-api-0.1.0-SNAPSHOT.jar
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  recommendations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
