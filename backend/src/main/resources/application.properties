spring.application.name=teamforge-api
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
teamforge.ai-url=${AI_SERVICE_URL:http://127.0.0.1:8001}
spring.datasource.url=jdbc:h2:file:./.local/teamforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
teamforge.moderator-ids=${TEAMFORGE_MODERATOR_IDS:}
